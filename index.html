<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Χριστιανισμός - Επιστήμη</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16161a" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Χρ. - Επιστήμη">
</head>
<body>

<header class="site-header">
  <div class="header-row">
    <div class="brand">
      <h1 data-i18n="app.title">Χριστιανισμός - Επιστήμη</h1>
      <p class="subtitle" id="subtitle"></p>
    </div>
    <div class="lang-switch" role="group" data-i18n-aria-label="lang.switch">
      <button type="button" data-lang="el" class="lang-btn">ΕΛ</button>
      <button type="button" data-lang="en" class="lang-btn">EN</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a6 6 0 104 10.5l4.3 4.3 1.4-1.4-4.3-4.3A6 6 0 0010 4zm0 2a4 4 0 110 8 4 4 0 010-8z"/></svg>
      <input type="search" id="search" autocomplete="off" spellcheck="false"
             data-i18n-placeholder="search.placeholder"
             data-i18n-aria-label="search.placeholder">
      <button type="button" id="search-clear" class="icon-btn subtle" hidden
              data-i18n-title="search.clear" data-i18n-aria-label="search.clear">✕</button>
    </div>
    <div class="toolbar-btns">
      <button type="button" id="filter-unheard" class="chip" aria-pressed="false"
              data-i18n="filter.unheard"></button>
      <button type="button" id="sort-toggle" class="chip"></button>
      <button type="button" id="expand-toggle" class="chip"></button>
    </div>
  </div>
</header>

<main id="main">
  <p class="status" id="status" data-i18n="app.loading"></p>

  <section id="install-card" class="panel install" hidden>
    <div class="install-head">
      <img class="install-icon" src="icons/icon-192.png" alt="" width="52" height="52">
      <div class="install-copy">
        <h2 class="install-title" data-i18n="install.title"></h2>
        <p class="install-sub" data-i18n="install.sub"></p>
      </div>
      <button type="button" class="icon-btn subtle install-x" id="btn-install-dismiss"
              data-i18n-title="install.continue" data-i18n-aria-label="install.continue">✕</button>
    </div>

    <div id="install-actions" hidden>
      <button type="button" class="btn-primary btn-install" id="btn-install">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.6l3.3-3.3 1.4 1.4L12 17.4l-4.7-4.7 1.4-1.4 3.3 3.3V3zM5 19h14v2H5z"/></svg>
        <span data-i18n="install.button"></span>
      </button>
      <button type="button" class="link-btn" id="btn-install-later" data-i18n="install.continue"></button>
    </div>

    <div id="install-ios" hidden>
      <ol class="ios-steps">
        <li>
          <span class="ios-num">1</span>
          <span class="ios-text" data-i18n="install.iosStep1"></span>
          <svg class="ios-glyph" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8.4 10.5H6.5A1.5 1.5 0 0 0 5 12v7.5A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V12a1.5 1.5 0 0 0-1.5-1.5h-1.9"/>
            <path d="M12 14.6V3.6"/>
            <path d="M8.6 7 12 3.6 15.4 7"/>
          </svg>
        </li>
        <li>
          <span class="ios-num">2</span>
          <span class="ios-text" data-i18n="install.iosStep2"></span>
          <svg class="ios-glyph" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4.2" y="4.2" width="15.6" height="15.6" rx="4.2"/>
            <path d="M12 8.4v7.2M8.4 12h7.2"/>
          </svg>
        </li>
      </ol>
      <button type="button" class="link-btn" id="btn-install-later-ios" data-i18n="install.continue"></button>
    </div>

    <p class="install-note" id="install-note" hidden></p>
  </section>

  <section id="continue-section" class="panel" hidden>
    <h2 data-i18n="continue.title"></h2>
    <div id="continue-card"></div>
  </section>

  <section id="recent-section" class="panel" hidden>
    <h2 data-i18n="recent.title"></h2>
    <ul id="recent-list" class="recent-list"></ul>
  </section>

  <p class="status" id="search-status" hidden></p>
  <div id="seasons"></div>
</main>

<footer class="player" id="player" hidden aria-live="off">
  <div class="ep-progress" id="ep-progress" data-i18n-aria-label="player.episodeProgress">
    <div class="ep-progress-fill" id="ep-progress-fill"></div>
  </div>

  <div class="player-inner">
    <div class="p-meta">
      <div class="p-title" id="p-title"></div>
      <div class="p-sub" id="p-sub"></div>
    </div>

    <div class="p-center">
      <div class="p-controls">
        <button type="button" class="icon-btn" id="btn-prev-ep" data-i18n-title="player.prevEpisode" data-i18n-aria-label="player.prevEpisode">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm12 0v12l-9-6z"/></svg>
        </button>
        <button type="button" class="icon-btn" id="btn-prev-part" data-i18n-title="player.prevPart" data-i18n-aria-label="player.prevPart">
          <svg viewBox="0 0 24 24"><path d="M18 6v12l-9-6zM9 6v12l-9-6z" transform="translate(3)"/></svg>
        </button>
        <button type="button" class="icon-btn" id="btn-back15" data-i18n-title="player.back15" data-i18n-aria-label="player.back15">
          <svg class="skip-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path class="ring" d="M12 4.5A7.5 7.5 0 1 1 5.5 8.25"/>
            <path d="M12.3 2.4v4.2L9 4.5z"/>
            <text x="12" y="15.4">15</text>
          </svg>
        </button>
        <button type="button" class="icon-btn play-btn" id="btn-play" data-state="paused" data-i18n-title="player.play" data-i18n-aria-label="player.play">
          <svg id="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
        </button>
        <button type="button" class="icon-btn" id="btn-fwd15" data-i18n-title="player.fwd15" data-i18n-aria-label="player.fwd15">
          <svg class="skip-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path class="ring" d="M12 4.5A7.5 7.5 0 1 0 18.5 8.25"/>
            <path d="M11.7 2.4v4.2L15 4.5z"/>
            <text x="12" y="15.4">15</text>
          </svg>
        </button>
        <button type="button" class="icon-btn" id="btn-next-part" data-i18n-title="player.nextPart" data-i18n-aria-label="player.nextPart">
          <svg viewBox="0 0 24 24"><path d="M6 6v12l9-6zM15 6v12l9-6z" transform="translate(-3)"/></svg>
        </button>
        <button type="button" class="icon-btn" id="btn-next-ep" data-i18n-title="player.nextEpisode" data-i18n-aria-label="player.nextEpisode">
          <svg viewBox="0 0 24 24"><path d="M18 6h-2v12h2zM6 6v12l9-6z"/></svg>
        </button>
      </div>

      <div class="p-seek">
        <span class="time" id="t-cur">0:00</span>
        <input type="range" id="seek" min="0" max="1000" value="0" step="1"
               data-i18n-aria-label="player.seek">
        <span class="time" id="t-dur">0:00</span>
      </div>
    </div>

    <div class="p-extra">
      <button type="button" class="chip listen-chip" id="btn-listened"></button>
      <button type="button" class="chip offline-chip" id="btn-offline" aria-pressed="false">
        <svg class="off-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 19a4.5 4.5 0 01-.4-8.98 6 6 0 0111.64-1.7A4.25 4.25 0 0117.75 19z"/></svg>
        <span id="offline-label"></span>
      </button>
      <label class="speed-wrap">
        <span class="vis-hidden" data-i18n="player.speed"></span>
        <select id="speed" data-i18n-title="player.speed">
          <option value="0.75">0.75×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
          <option value="1.75">1.75×</option>
          <option value="2">2×</option>
        </select>
      </label>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="1"
             class="volume" data-i18n-title="player.volume" data-i18n-aria-label="player.volume">
    </div>
  </div>
</footer>

<audio id="audio" preload="metadata"></audio>

<script src="i18n.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
