<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Χριστιανισμός - Επιστήμη</title>
<script>
  /* The chosen theme, applied before the page first paints (app.js loads
     too late to avoid a flash of the other one). */
  try {
    var th = JSON.parse(localStorage.getItem("cs:v1:theme"));
    if (th === "light" || th === "dark") document.documentElement.dataset.theme = th;
  } catch (e) {}
</script>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16161a" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Χρ. - Επιστήμη">
</head>
<body>

<header class="site-header">
  <div class="header-row">
    <div class="brand">
      <h1 data-i18n="app.title">Χριστιανισμός - Επιστήμη</h1>
      <p class="subtitle" id="subtitle"></p>
    </div>
    <div class="header-actions">
      <button type="button" class="icon-btn subtle" id="btn-keys"
              data-i18n-title="keys.open" data-i18n-aria-label="keys.open">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18a1 1 0 011 1v10a1 1 0 01-1 1H3a1 1 0 01-1-1V7a1 1 0 011-1zm1 2v8h16V8zm1 1h2v2H5zm3 0h2v2H8zm3 0h2v2h-2zm3 0h2v2h-2zm3 0h2v2h-2zM5 12h2v2H5zm3 0h8v2H8zm9 0h2v2h-2z"/></svg>
      </button>
      <button type="button" class="icon-btn subtle theme-btn" id="btn-theme" data-mode="auto">
        <svg class="th-auto" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 3a9 9 0 110 18 9 9 0 010-18zm0 2a7 7 0 100 14 7 7 0 000-14zm0 0v14a7 7 0 010-14z"/></svg>
        <svg class="th-light" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zM11 1h2v3h-2zm0 19h2v3h-2zM1 11h3v2H1zm19 0h3v2h-3zM4.2 5.6l1.4-1.4 2.1 2.1-1.4 1.4zm12.1 12.1l1.4-1.4 2.1 2.1-1.4 1.4zM4.2 18.4l2.1-2.1 1.4 1.4-2.1 2.1zm12.1-12.1l2.1-2.1 1.4 1.4-2.1 2.1z"/></svg>
        <svg class="th-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 14.6A8.5 8.5 0 019.4 3.8a8.5 8.5 0 1010.8 10.8z"/></svg>
      </button>
      <div class="lang-switch" role="group" data-i18n-aria-label="lang.switch">
        <button type="button" data-lang="el" class="lang-btn">ΕΛ</button>
        <button type="button" data-lang="en" class="lang-btn">EN</button>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a6 6 0 104 10.5l4.3 4.3 1.4-1.4-4.3-4.3A6 6 0 0010 4zm0 2a4 4 0 110 8 4 4 0 010-8z"/></svg>
      <input type="search" id="search" autocomplete="off" spellcheck="false"
             data-i18n-placeholder="search.placeholder"
             data-i18n-aria-label="search.placeholder">
      <button type="button" id="search-clear" class="icon-btn subtle" hidden
              data-i18n-title="search.clear" data-i18n-aria-label="search.clear">✕</button>
    </div>
    <div class="toolbar-btns">
      <button type="button" id="filter-unheard" class="chip" aria-pressed="false"
              data-i18n="filter.unheard"></button>
      <button type="button" id="sort-toggle" class="chip"></button>
      <button type="button" id="expand-toggle" class="chip"></button>
    </div>
  </div>
</header>

<main id="main">
  <p class="status" id="status" data-i18n="app.loading"></p>

  <section id="install-card" class="panel install" hidden>
    <div class="install-head">
      <img class="install-icon" src="icons/icon-192.png" alt="" width="52" height="52">
      <div class="install-copy">
        <h2 class="install-title" data-i18n="install.title"></h2>
        <p class="install-sub" data-i18n="install.sub"></p>
      </div>
      <button type="button" class="icon-btn subtle install-x" id="btn-install-dismiss"
              data-i18n-title="install.continue" data-i18n-aria-label="install.continue">✕</button>
    </div>

    <div id="install-actions" hidden>
      <button type="button" class="btn-primary btn-install" id="btn-install">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.6l3.3-3.3 1.4 1.4L12 17.4l-4.7-4.7 1.4-1.4 3.3 3.3V3zM5 19h14v2H5z"/></svg>
        <span data-i18n="install.button"></span>
      </button>
      <button type="button" class="link-btn" id="btn-install-later" data-i18n="install.continue"></button>
    </div>

    <div id="install-ios" hidden>
      <ol class="ios-steps">
        <li>
          <span class="ios-num">1</span>
          <span class="ios-text" data-i18n="install.iosStep1"></span>
          <svg class="ios-glyph" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8.4 10.5H6.5A1.5 1.5 0 0 0 5 12v7.5A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V12a1.5 1.5 0 0 0-1.5-1.5h-1.9"/>
            <path d="M12 14.6V3.6"/>
            <path d="M8.6 7 12 3.6 15.4 7"/>
          </svg>
        </li>
        <li>
          <span class="ios-num">2</span>
          <span class="ios-text" data-i18n="install.iosStep2"></span>
          <svg class="ios-glyph" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4.2" y="4.2" width="15.6" height="15.6" rx="4.2"/>
            <path d="M12 8.4v7.2M8.4 12h7.2"/>
          </svg>
        </li>
      </ol>
      <button type="button" class="link-btn" id="btn-install-later-ios" data-i18n="install.continue"></button>
    </div>

    <p class="install-note" id="install-note" hidden></p>
  </section>

  <section id="continue-section" class="panel" hidden>
    <h2 data-i18n="continue.title"></h2>
    <div id="continue-card"></div>
  </section>

  <section id="new-section" class="panel" hidden>
    <div class="panel-head">
      <h2 data-i18n="new.title"></h2>
      <button type="button" class="link-btn" id="btn-new-dismiss"
              data-i18n="new.dismiss" data-i18n-title="new.dismissHint"></button>
    </div>
    <ul id="new-list" class="recent-list"></ul>
  </section>

  <section id="recent-section" class="panel" hidden>
    <h2 data-i18n="recent.title"></h2>
    <ul id="recent-list" class="recent-list"></ul>
  </section>

  <p class="status" id="search-status" hidden></p>
  <div id="seasons"></div>
</main>

<footer class="player" id="player" hidden aria-live="off">
  <div class="np-head">
    <button type="button" class="icon-btn" id="btn-np-close" data-i18n-title="np.close" data-i18n-aria-label="np.close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.6 8.6 12 13.2 7.4 8.6 6 10l6 6 6-6z"/></svg>
    </button>
    <span class="np-label" data-i18n="np.title"></span>
    <span class="np-spacer" aria-hidden="true"></span>
  </div>

  <div class="ep-progress" id="ep-progress" data-i18n-aria-label="player.episodeProgress">
    <div class="ep-progress-fill" id="ep-progress-fill"></div>
  </div>

  <div class="player-inner">
    <div class="p-meta">
      <img class="p-art" src="icons/icon-512.png" alt="" width="44" height="44">
      <div class="p-text">
        <div class="p-title" id="p-title"></div>
        <div class="p-sub" id="p-sub"></div>
      </div>
      <button type="button" class="icon-btn subtle np-expand" id="btn-np-open" aria-expanded="false"
              data-i18n-title="np.open" data-i18n-aria-label="np.open">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8l-6 6 1.4 1.4 4.6-4.6 4.6 4.6L18 14z"/></svg>
      </button>
    </div>

    <div class="p-center">
      <div class="p-parts">
        <div class="p-segs" id="p-segs"></div>
        <div class="p-parts-cap"><span id="np-part"></span><span id="np-left"></span></div>
      </div>
      <div class="p-controls">
        <button type="button" class="icon-btn" id="btn-prev-ep" data-i18n-title="player.prevEpisode" data-i18n-aria-label="player.prevEpisode">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm12 0v12l-9-6z"/></svg>
        </button>
        <button type="button" class="icon-btn" id="btn-prev-part" data-i18n-title="player.prevPart" data-i18n-aria-label="player.prevPart">
          <svg viewBox="0 0 24 24"><path d="M18 6v12l-9-6zM9 6v12l-9-6z" transform="translate(3)"/></svg>
        </button>
        <button type="button" class="icon-btn" id="btn-back15" data-i18n-title="player.back15" data-i18n-aria-label="player.back15">
          <svg class="skip-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path class="ring" d="M12 4.5A7.5 7.5 0 1 1 5.5 8.25"/>
            <path d="M12.3 2.4v4.2L9 4.5z"/>
            <text x="12" y="15.4">15</text>
          </svg>
        </button>
        <button type="button" class="icon-btn play-btn" id="btn-play" data-state="paused" data-i18n-title="player.play" data-i18n-aria-label="player.play">
          <svg id="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
        </button>
        <button type="button" class="icon-btn" id="btn-fwd15" data-i18n-title="player.fwd15" data-i18n-aria-label="player.fwd15">
          <svg class="skip-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path class="ring" d="M12 4.5A7.5 7.5 0 1 0 18.5 8.25"/>
            <path d="M11.7 2.4v4.2L15 4.5z"/>
            <text x="12" y="15.4">15</text>
          </svg>
        </button>
        <button type="button" class="icon-btn" id="btn-next-part" data-i18n-title="player.nextPart" data-i18n-aria-label="player.nextPart">
          <svg viewBox="0 0 24 24"><path d="M6 6v12l9-6zM15 6v12l9-6z" transform="translate(-3)"/></svg>
        </button>
        <button type="button" class="icon-btn" id="btn-next-ep" data-i18n-title="player.nextEpisode" data-i18n-aria-label="player.nextEpisode">
          <svg viewBox="0 0 24 24"><path d="M18 6h-2v12h2zM6 6v12l9-6z"/></svg>
        </button>
      </div>

      <div class="p-seek">
        <span class="time" id="t-cur">0:00</span>
        <input type="range" id="seek" min="0" max="1000" value="0" step="1"
               data-i18n-aria-label="player.seek">
        <span class="time" id="t-dur">0:00</span>
      </div>
    </div>

    <div class="p-extra">
      <div class="p-group">
        <button type="button" class="chip listen-chip" id="btn-listened" aria-pressed="false">
          <svg class="listen-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>
          <span id="listened-label"></span>
        </button>
        <button type="button" class="chip offline-chip" id="btn-offline">
          <svg class="off-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 19a4.5 4.5 0 01-.4-8.98 6 6 0 0111.64-1.7A4.25 4.25 0 0117.75 19z"/></svg>
          <span id="offline-label"></span>
        </button>
      </div>
      <div class="p-group">
        <button type="button" class="chip autoplay-chip" id="btn-autoplay" aria-pressed="false">
          <svg class="chip-icon" viewBox="0.5 1.5 24 24" aria-hidden="true"><path d="M3 6h11v2H3zm0 4h11v2H3zm0 4h7v2H3zm13-1v8l6-4z"/></svg>
          <span id="autoplay-label" data-i18n="autoplay.label"></span>
        </button>
        <button type="button" class="chip share-chip" id="btn-share"
                data-i18n-title="share.title" data-i18n-aria-label="share.title">
          <svg class="chip-icon" viewBox="1 0 24 24" aria-hidden="true"><path d="M18 16.1c-.8 0-1.4.3-2 .8l-7.1-4.2c.1-.2.1-.5.1-.7s0-.5-.1-.7L16 7.2c.5.5 1.2.8 2 .8 1.7 0 3-1.3 3-3s-1.3-3-3-3-3 1.3-3 3c0 .2 0 .5.1.7L8 9.8C7.5 9.3 6.8 9 6 9c-1.7 0-3 1.3-3 3s1.3 3 3 3c.8 0 1.5-.3 2-.8l7.1 4.2c-.1.2-.1.4-.1.6 0 1.6 1.3 2.9 2.9 2.9s2.9-1.3 2.9-2.9-1.2-2.9-2.8-2.9z"/></svg>
        </button>
        <label class="chip sleep-chip" id="sleep-chip" data-active="false" data-i18n-title="sleep.title">
          <svg class="sleep-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 14.6A8.5 8.5 0 019.4 3.8a8.5 8.5 0 1010.8 10.8z"/></svg>
          <span id="sleep-label"></span>
          <select id="sleep" data-i18n-aria-label="sleep.title">
            <option value="0" selected></option>
            <option value="15"></option>
            <option value="30"></option>
            <option value="45"></option>
            <option value="60"></option>
            <option value="part"></option>
            <option value="episode"></option>
          </select>
        </label>
        <label class="speed-wrap">
          <span class="vis-hidden" data-i18n="player.speed"></span>
          <select id="speed" data-i18n-title="player.speed">
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="1.75">1.75×</option>
            <option value="2">2×</option>
          </select>
        </label>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="1"
               class="volume" data-i18n-title="player.volume" data-i18n-aria-label="player.volume">
      </div>
    </div>
  </div>
</footer>

<dialog id="keys-dialog" class="keys-dialog" aria-labelledby="keys-title">
  <div class="keys-head">
    <h2 id="keys-title" data-i18n="keys.title"></h2>
    <button type="button" class="icon-btn subtle" id="btn-keys-close"
            data-i18n-title="keys.close" data-i18n-aria-label="keys.close">✕</button>
  </div>
  <dl class="keys-list">
    <div><dt><kbd data-i18n="keys.space"></kbd> <kbd>K</kbd></dt><dd data-i18n="keys.play"></dd></div>
    <div><dt><kbd>←</kbd> <kbd>→</kbd></dt><dd data-i18n="keys.skip"></dd></div>
    <div><dt><kbd>Shift</kbd> + <kbd>←</kbd> <kbd>→</kbd></dt><dd data-i18n="keys.part"></dd></div>
    <div><dt><kbd>Shift</kbd> + <kbd>P</kbd> <kbd>N</kbd></dt><dd data-i18n="keys.episode"></dd></div>
    <div><dt><kbd>/</kbd></dt><dd data-i18n="keys.search"></dd></div>
    <div><dt><kbd>?</kbd></dt><dd data-i18n="keys.help"></dd></div>
    <div><dt><kbd>Esc</kbd></dt><dd data-i18n="keys.esc"></dd></div>
  </dl>
</dialog>

<audio id="audio" preload="metadata"></audio>

<script src="i18n.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
