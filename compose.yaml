# docker compose up -d
name: christianity-science

services:
  christianity-science:
    image: giorgospap777/christianity-science-pwa:latest
    container_name: christianity-science
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # EDIT THIS PATH -- the folder holding the "<N>ος Κύκλος Εκπομπών"
      # season directories. Read-only: the app never writes to your archive.
      - /path/to/christianity-science:/archive:ro
      # The generated index and the smaller copies (/data/lite). Shared with
      # the downloader below, which rebuilds the same index.
      - index-data:/data
    environment:
      # 0 skips the startup scan and reuses the previous index
      REBUILD_INDEX: "1"
      # Listening is paced after the first PLAY_BURST bytes, so a seek does
      # not wait behind the rest of the part on a small uplink. 0 = unpaced.
      # PLAY_KBPS: "512"
      # PLAY_BURST: "131072"
      # Saving an episode for offline listening is paced to this many kbit/s,
      # with at most SAVE_SLOTS saves at once across all listeners.
      # SAVE_KBPS: "256"
      # SAVE_SLOTS: "2"

    # Runs as uid 10001 by default. Most archives are world-readable, so this
    # is usually fine. If yours is not, uncomment and match your host user --
    # the index is written to /data, which any uid can write.
    # user: "1000:1000"

  # Optional: download new episodes from the official site into the archive
  # every 6 hours, and make 64 kbps copies of new high-bitrate parts. It needs
  # the archive read-write, so it runs on its own and the player above keeps
  # its read-only mount. See "Downloading new episodes automatically" in the
  # README. To make copies of the whole archive once (slow, low priority):
  #   docker compose run --rm fetcher lite
  # fetcher:
  #   image: giorgospap777/christianity-science-pwa:latest
  #   container_name: christianity-science-fetcher
  #   restart: unless-stopped
  #   command: ["fetch", "--every", "6h"]
  #   volumes:
  #     - /path/to/christianity-science:/archive    # read-write
  #     - index-data:/data
  #   user: "1000:1000"                            # a user who owns the archive
  #   healthcheck:
  #     disable: true

volumes:
  index-data:
