# Copy .env.example to .env and set ARCHIVE_PATH, then: docker compose up -d
services:
  christianity-science:
    image: giorgospap777/christianity-science-pwa:latest
    container_name: christianity-science
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      # The folder holding the "<N>ος Κύκλος Εκπομπών" season directories.
      # Read-only: the app never writes to your archive.
      - ${ARCHIVE_PATH:?set ARCHIVE_PATH in .env}:/archive:ro
    environment:
      # 0 skips the startup scan and reuses the previous index
      REBUILD_INDEX: "1"
    # The archive must be readable by the container user (uid 10001).
    # If it is not, match your host user instead:
    # user: "1000:1000"
