# docker compose up -d
name: christianity-science

services:
  christianity-science:
    image: giorgospap777/christianity-science-pwa:latest
    container_name: christianity-science
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # EDIT THIS PATH -- the folder holding the "<N>ος Κύκλος Εκπομπών"
      # season directories. Read-only: the app never writes to your archive.
      - /path/to/christianity-science:/archive:ro
    environment:
      # 0 skips the startup scan and reuses the previous index
      REBUILD_INDEX: "1"

    # Runs as uid 10001 by default. Most archives are world-readable, so this
    # is usually fine. If yours is not, uncomment and match your host user --
    # the index is written to /data, which any uid can write.
    # user: "1000:1000"

    # Optional: persist the generated index so REBUILD_INDEX=0 is useful.
    # Needed, too, by the downloader below, which rebuilds this same index.
    # volumes:
    #   - index-data:/data

  # Optional: download new episodes from the official site into the archive
  # every 6 hours. It needs the archive read-write, so it runs on its own and
  # the player above keeps its read-only mount. See "Downloading new episodes
  # automatically" in the README.
  # fetcher:
  #   image: giorgospap777/christianity-science-pwa:latest
  #   container_name: christianity-science-fetcher
  #   restart: unless-stopped
  #   command: ["fetch", "--every", "6h"]
  #   volumes:
  #     - /path/to/christianity-science:/archive    # read-write
  #     - index-data:/data
  #   user: "1000:1000"                            # a user who owns the archive
  #   healthcheck:
  #     disable: true

# volumes:
#   index-data:
